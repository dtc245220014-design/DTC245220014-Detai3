# =====================================================================
# nginx/default.conf - Reverse Proxy + SSL (DTC245220014-Detai3)
# =====================================================================

# An thong tin phien ban Nginx
server_tokens off;

# Gioi han upload (WordPress media)
client_max_body_size 64m;

# ---------------------------------------------------------------------
# Redirect HTTP (port 80) -> HTTPS (port 443)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# HTTPS (port 443) - SSL tu ky
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # --- SSL self-signed (sinh boi openssl, xem muc 4) ---
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: http: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------
    # WordPress - proxy ve service wordpress:80
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # -----------------------------------------------------------------
    # phpMyAdmin - proxy ve service phpmyadmin:80 qua sub-path
    # -----------------------------------------------------------------
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /phpmyadmin;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    # --- Chan truy cap vao cac file nhay cam ---
    location ~ /\.well-known {
        allow all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
