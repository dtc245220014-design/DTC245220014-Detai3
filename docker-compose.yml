# =====================================================================
# docker-compose.yml - DTC245220014-Detai3
# De 3 - Website Quang ba San pham (WordPress + MySQL + Nginx + PMA)
# 4 services: db, wordpress, phpmyadmin, nginx
# 2 networks: frontend_net, backend_net (Network Isolation)
# =====================================================================

services:

  # -----------------------------------------------------------------
  # 1. DATABASE - MySQL 8.0 (chi nam trong backend_net)
  # -----------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: dtc3_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------------
  # 2. WORDPRESS (PHP-FPM/Apache) - ket noi ca 2 network
  # -----------------------------------------------------------------
  wordpress:
    image: wordpress:latest
    container_name: dtc3_wordpress
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: ${WORDPRESS_CONFIG_EXTRA}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # -----------------------------------------------------------------
  # 3. PHPMYADMIN - quan tri MySQL qua giao dien web
  # -----------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: dtc3_phpmyadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  # -----------------------------------------------------------------
  # 4. NGINX REVERSE PROXY + SSL - chi nam trong frontend_net
  # -----------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: dtc3_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net

# =====================================================================
# VOLUMES & NETWORKS
# =====================================================================
volumes:
  db_data:
  nginx_logs:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true   # backend_net khong co truy cap Internet ben ngoai
