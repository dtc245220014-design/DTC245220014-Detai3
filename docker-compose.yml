# =====================================================================
# docker-compose.yml - DTC245220014-Detai3
# De 3 - Website Quang ba San pham (WordPress + MySQL + Nginx + PMA)
# + He thong giam sat: Prometheus + cAdvisor + Node-Exporter + Grafana
# + He thong log tap trung: Loki + Promtail
# 10 services: db, wordpress, phpmyadmin, nginx,
#              prometheus, cadvisor, node-exporter, grafana, loki, promtail
# 2 networks: frontend_net, backend_net (Network Isolation)
# =====================================================================

services:

  # -----------------------------------------------------------------
  # 1. DATABASE - MySQL 8.0 (chi nam trong backend_net)
  # -----------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: dtc3_mysql
    restart: unless-stopped
    # --- HARDENING #2 & #3: chan nang cao quyen + gioi han tai nguyen ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------------
  # 2. WORDPRESS (PHP-FPM/Apache) - ket noi ca 2 network
  # -----------------------------------------------------------------
  wordpress:
    image: wordpress:latest
    container_name: dtc3_wordpress
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: ${WORDPRESS_CONFIG_EXTRA}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # -----------------------------------------------------------------
  # 3. PHPMYADMIN - quan tri MySQL qua giao dien web
  # -----------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: dtc3_phpmyadmin
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  # -----------------------------------------------------------------
  # 4. NGINX REVERSE PROXY + SSL - chi nam trong frontend_net
  # -----------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: dtc3_nginx
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 5. PROMETHEUS - quan ly & luu metrics (scrape 5s)
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: dtc3_prometheus
    restart: unless-stopped
    # --- HARDENING #2 & #3: chay as nobody nen drop ALL cap duoc ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 6. CADVISOR - giam sat tai nguyen Container (CPU/RAM/Network/IO)
  #    NOTE: de bai yeu cau v0.47.0 (gcr.io/cadvisor/cadvisor:v0.47.0),
  #    nhung phien ban do khong doc duoc containerd-snapshotter layout
  #    cua Docker 29 (loi "failed to identify the read-write layer ID",
  #    xem google/cadvisor#3643 va PR #3709). Fix phat hanh tu v0.54.0,
  #    image chinh chuyen sang ghcr.io/google/cadvisor. Dung v0.60.5
  #    de metrics container (CPU/RAM/Network) lay duoc so lieu that.
  # -----------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: dtc3_cadvisor
    restart: unless-stopped
    # --- HARDENING #3: gioi han tai nguyen cho container monitoring ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - "--docker_only"
      - "--housekeeping_interval=5s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 7. NODE-EXPORTER - thu thong so CPU/RAM/Disk/Network cua MAY HOST
  # -----------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: dtc3_nodeexporter
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9100"
    pid: host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 8. GRAFANA - dashboard truc quan hoa metrics
  # -----------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    container_name: dtc3_grafana
    restart: unless-stopped
    # --- HARDENING #2 & #3: chay as uid 472 (non-root) + drop ALL cap ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 9. LOKI - quan ly log tap trung (Luu tru filesystem)
  # -----------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.2
    container_name: dtc3_loki
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - frontend_net

  # -----------------------------------------------------------------
  # 10. PROMTAIL - thu log stdout cua tat ca container ve Loki
  # -----------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.2
    container_name: dtc3_promtail
    restart: unless-stopped
    # --- HARDENING #2 & #3 ---
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # positions persistent - khong bi replay log cu khi recreate container
      - ./promtail/positions.yaml:/tmp/positions.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - frontend_net

# =====================================================================
# VOLUMES & NETWORKS
# =====================================================================
volumes:
  db_data:
  nginx_logs:
  grafana_data:
  prometheus_data:
  loki_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true   # backend_net khong co truy cap Internet ben ngoai
